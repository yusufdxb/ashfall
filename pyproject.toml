[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashfall"
version = "0.4.0"
description = "Archived research program on failure-driven policy repair and simulator diagnosis; five preregistered toy studies produced negative results against strong baselines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yusuf Guenena", email = "yusuf.a.guenena@gmail.com"}]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "rich>=13.0",
    "tabulate>=0.9",
]

[project.scripts]
ashfall = "ashfall.cli:main"

[project.optional-dependencies]
sim = [
    "torch>=2.1",
    "tensorboard",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "hypothesis>=6.0",
    "ruff",
    "black",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: requires Isaac Lab (deselect with -m 'not sim')",
    "guard: scientific guard that must fail when its protected defect is reintroduced",
]

[tool.mypy]
# No python_version pin: mypy targets the interpreter it runs under. Pinned to 3.10
# it could not parse numpy >= 2.3 stubs on 3.12 (PEP 695 type statements). ruff
# target-version py310 and the 3.10 CI job keep the code itself 3.10-compatible.
ignore_missing_imports = true
warn_unused_ignores = false
# Typed core. Legacy analysis modules are checked as they are migrated.
files = [
    "src/ashfall/ontology.py",
    "src/ashfall/provenance.py",
    "src/ashfall/backends/phoenix_compat.py",
    "src/ashfall/counterfactual.py",
    "src/ashfall/gates.py",
    "src/ashfall/fbr/criterion.py",
    "src/ashfall/fbr/capsule.py",
    "src/ashfall/fbr/boundary.py",
    "src/ashfall/fbr/acceptance.py",
    "src/ashfall/h0.py",
    "src/ashfall/datasets.py",
    "src/ashfall/config_guard.py",
]

[tool.black]
line-length = 100
target-version = ["py310"]

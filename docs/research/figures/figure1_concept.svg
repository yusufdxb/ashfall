<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5347"/>
    </marker>
    <g id="dog">
      <rect x="-38" y="-16" width="76" height="22" rx="8" fill="#3d4250"/>
      <rect x="34" y="-24" width="20" height="16" rx="5" fill="#3d4250"/>
      <line x1="-30" y1="6" x2="-36" y2="34" stroke="#3d4250" stroke-width="5" stroke-linecap="round"/>
      <line x1="-18" y1="6" x2="-12" y2="34" stroke="#3d4250" stroke-width="5" stroke-linecap="round"/>
      <line x1="18" y1="6" x2="12" y2="34" stroke="#3d4250" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="6" x2="36" y2="34" stroke="#3d4250" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Panel titles -->
  <g font-size="15" font-weight="bold" fill="#2b2b2b">
    <text x="20" y="30">(a) The GO2 fails here</text>
    <text x="315" y="30">(b) Failure capsule</text>
    <text x="610" y="30">(c) Replay around the boundary</text>
    <text x="905" y="30">(d) Retest, then move the patch</text>
  </g>

  <!-- (a) slip on patch -->
  <rect x="20" y="230" width="270" height="8" fill="#b9b2a3"/>
  <rect x="140" y="230" width="110" height="8" fill="#6fa8dc"/>
  <text x="195" y="256" font-size="11" text-anchor="middle" fill="#2f5f8f">low-friction patch</text>
  <g transform="translate(170,196) rotate(18)"><use href="#dog"/></g>
  <path d="M150,226 q20,-6 40,0" fill="none" stroke="#c0504d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="160" y="110" font-size="12" fill="#c0504d">foot slips, body pitches</text>
  <text x="20" y="300" font-size="11" fill="#5a5347">baseline policy, broad friction DR</text>
  <text x="20" y="316" font-size="11" fill="#5a5347">traverse fails at a measured surface</text>

  <!-- (b) capsule timeline -->
  <line x1="320" y1="230" x2="580" y2="230" stroke="#5a5347" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="575" y="248" font-size="11" text-anchor="end" fill="#5a5347">time</text>
  <line x1="320" y1="230" x2="320" y2="70" stroke="#5a5347" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="326" y="80" font-size="11" fill="#5a5347">body tilt</text>
  <rect x="420" y="70" width="90" height="160" fill="#fbe9d7"/>
  <line x1="320" y1="120" x2="580" y2="120" stroke="#c0504d" stroke-dasharray="5,4" stroke-width="1.2"/>
  <text x="578" y="114" font-size="10" text-anchor="end" fill="#c0504d">criterion</text>
  <path d="M320,215 C350,210 370,220 400,212 C430,205 450,208 470,190 C490,170 500,140 510,118 C520,100 530,90 545,80" fill="none" stroke="#3d4250" stroke-width="2.5"/>
  <line x1="510" y1="70" x2="510" y2="230" stroke="#c0504d" stroke-width="2"/>
  <text x="514" y="66" font-size="11" fill="#c0504d">onset</text>
  <g fill="#e07b39"><circle cx="440" cy="210" r="5"/><circle cx="465" cy="195" r="5"/><circle cx="490" cy="165" r="5"/></g>
  <text x="465" y="270" font-size="11" text-anchor="middle" fill="#5a5347">seed states at fixed lead times</text>
  <text x="465" y="286" font-size="11" text-anchor="middle" fill="#5a5347">+ command, policy hash, criterion</text>
  <text x="330" y="316" font-size="11" fill="#5a5347">accepted only if a matched sim replay</text>
  <text x="330" y="332" font-size="11" fill="#5a5347">fails like the robot and its control does not</text>

  <!-- (c) boundary sampling -->
  <line x1="630" y1="230" x2="880" y2="230" stroke="#5a5347" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="878" y="248" font-size="11" text-anchor="end" fill="#5a5347">patch friction</text>
  <line x1="630" y1="230" x2="630" y2="70" stroke="#5a5347" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="640" y="62" font-size="11" fill="#5a5347">P(failure | seed state)</text>
  <rect x="712" y="70" width="42" height="160" fill="#fbe9d7" opacity="0.9"/>
  <path d="M635,80 C690,82 700,86 715,110 C730,140 740,190 760,215 C780,228 820,229 875,229" fill="none" stroke="#3d4250" stroke-width="2.5"/>
  <line x1="636" y1="155" x2="875" y2="155" stroke="#9a8f7a" stroke-dasharray="3,3"/>
  <text x="872" y="150" font-size="10" text-anchor="end" fill="#9a8f7a">0.5</text>
  <g fill="#b9b2a3"><circle cx="650" cy="262" r="4"/><circle cx="672" cy="262" r="4"/><circle cx="700" cy="262" r="4"/><circle cx="741" cy="262" r="4"/><circle cx="770" cy="262" r="4"/><circle cx="795" cy="262" r="4"/><circle cx="820" cy="262" r="4"/><circle cx="848" cy="262" r="4"/><circle cx="866" cy="262" r="4"/></g>
  <text x="886" y="266" font-size="10" fill="#7a7466">broad DR</text>
  <g fill="#e07b39"><circle cx="716" cy="282" r="4"/><circle cx="724" cy="282" r="4"/><circle cx="731" cy="282" r="4"/><circle cx="737" cy="282" r="4"/><circle cx="743" cy="282" r="4"/><circle cx="749" cy="282" r="4"/><circle cx="727" cy="282" r="4"/></g>
  <text x="886" y="286" font-size="10" fill="#e07b39">FBR</text>
  <text x="640" y="316" font-size="11" fill="#5a5347">same budget; FBR resets restore the capsule</text>
  <text x="640" y="332" font-size="11" fill="#5a5347">states, friction near each boundary</text>

  <!-- (d) retest -->
  <rect x="915" y="160" width="270" height="8" fill="#b9b2a3"/>
  <rect x="1030" y="160" width="100" height="8" fill="#6fa8dc"/>
  <g transform="translate(1115,126)"><use href="#dog"/></g>
  <text x="1080" y="186" font-size="11" text-anchor="middle" fill="#2f5f8f">same patch</text>
  <rect x="915" y="250" width="270" height="8" fill="#b9b2a3"/>
  <rect x="960" y="250" width="100" height="8" fill="#9fc5e8"/>
  <g transform="translate(1090,216)"><use href="#dog"/></g>
  <text x="1010" y="276" font-size="11" text-anchor="middle" fill="#2f5f8f">moved or changed patch (held out)</text>
  <text x="915" y="316" font-size="11" fill="#5a5347">predeclared trials; FBR vs broad DR;</text>
  <text x="915" y="332" font-size="11" fill="#5a5347">every trial kept, including failures</text>

  <!-- panel arrows -->
  <line x1="295" y1="180" x2="312" y2="180" stroke="#5a5347" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588" y1="180" x2="606" y2="180" stroke="#5a5347" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="180" x2="900" y2="180" stroke="#5a5347" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
